name: Mintcom Frontend CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Quality & Duplication Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate Locales (encoding + key resolution)
        run: npm run validate:locales

      - name: ESLint Check (zero-warning ceiling)
        run: npm run lint:check

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: TypeCheck & Build
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm test -- --run

      - name: Code Duplication Gate (jscpd)
        run: npm run check:duplication

      - name: Run E2E Tests (Playwright)
        run: npx playwright test
        env:
          CI: true
